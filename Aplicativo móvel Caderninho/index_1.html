<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderninho — cobranças em dia</title>
<meta name="description" content="Toque para copiar o código Pix ou ver o QR Code.">
<meta property="og:title" content="Pagamento via Pix">
<meta property="og:description" content="Toque para copiar o código Pix ou ver o QR Code.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F9; --card:#FFFFFF; --line:#E2E7F1; --ink:#1F2F6B; --ink-2:#56648C;
  --text:#18203A; --muted:#667090; --hl:#FFE14D; --hl-soft:#FFF5BF;
  --green:#15774A; --green-bg:#E2F3E9; --red:#BE3A30; --red-bg:#FBE8E6;
  --amber:#8F5E07; --amber-bg:#FCEFD5; --blue-bg:#E7ECFB; --btn:#1F2F6B; --btn-text:#FFFFFF;
  --wa:#178553; --bubble:#DDF5D3; --focus:#3558D6;
  --shadow:0 1px 2px rgba(24,32,58,.05),0 10px 28px -14px rgba(24,32,58,.22);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --card:#171E30; --line:#28314A; --ink:#BCC9FF; --ink-2:#909CC4;
    --text:#E8ECF7; --muted:#98A2BF; --hl:#C9A92A; --hl-soft:#3A3416;
    --green:#72D49F; --green-bg:#16301F; --red:#F28B80; --red-bg:#3B1C21;
    --amber:#EDBE63; --amber-bg:#3A2D14; --blue-bg:#222C48; --btn:#BCC9FF; --btn-text:#101729;
    --wa:#1B8A56; --bubble:#1E3B2B; --focus:#90A9FF;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --card:#171E30; --line:#28314A; --ink:#BCC9FF; --ink-2:#909CC4;
  --text:#E8ECF7; --muted:#98A2BF; --hl:#C9A92A; --hl-soft:#3A3416;
  --green:#72D49F; --green-bg:#16301F; --red:#F28B80; --red-bg:#3B1C21;
  --amber:#EDBE63; --amber-bg:#3A2D14; --blue-bg:#222C48; --btn:#BCC9FF; --btn-text:#101729;
  --wa:#1B8A56; --bubble:#1E3B2B; --focus:#90A9FF;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.5 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
svg{flex:none}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
.small{font-size:14px;color:var(--muted);margin:0}
.c-red{color:var(--red)} .c-green{color:var(--green)}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px;font:800 20px/1 var(--display);color:var(--ink);letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.date{color:var(--muted);font-size:15px}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

h1{font:800 30px/1.1 var(--display);color:var(--ink);margin:14px 0 4px;letter-spacing:-.02em}
h2{font:700 19px/1.2 var(--display);color:var(--ink);margin:0}
.sec-head{display:flex;align-items:center;gap:8px;margin:30px 0 12px}
.count{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--ink);color:var(--card);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}

/* Hero: o valor grifado com marca-texto */
.hero{margin-top:8px;padding:22px 20px 20px;background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
.ola{margin:0;color:var(--muted);font-size:16px}
.hero-label{margin:14px 0 2px;font-weight:700;color:var(--ink-2)}
.hero-num{margin:0 0 16px;font:800 clamp(42px,12.5vw,62px)/1.05 var(--display);color:var(--ink);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.hl{background-image:linear-gradient(100deg,transparent 0 1%,var(--hl) 3% 97%,transparent 99%);background-repeat:no-repeat;background-size:100% 42%;background-position:0 86%;padding:0 .08em;margin:0 -.08em;border-radius:3px}
.anim .hl{animation:grifo .7s .15s cubic-bezier(.3,.7,.3,1) both}
@keyframes grifo{from{background-size:0% 42%}to{background-size:100% 42%}}
@media (prefers-reduced-motion:reduce){.anim .hl{animation:none}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;min-height:34px;padding:0 13px;border-radius:999px;background:var(--blue-bg);color:var(--ink);font-size:15px;font-weight:700;border:0}
.p-red{background:var(--red-bg);color:var(--red)}
.p-green{background:var(--green-bg);color:var(--green)}
.mes-prog{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mes-prog p{margin:8px 0 0;font-size:15px;color:var(--muted)}
.mes-prog strong{color:var(--text)}
.barra{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.barra span{display:block;height:100%;background:var(--green);border-radius:999px}

/* Primeiros passos */
.setup{margin-top:18px;padding:18px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.passos{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.passos li{display:flex;align-items:center;gap:12px;padding:10px 0}
.passos li + li{border-top:1px solid var(--line)}
.passo-n{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700;background:var(--blue-bg);color:var(--ink)}
.passo-n svg{width:18px;height:18px}
.passos li.ok .passo-n{background:var(--green-bg);color:var(--green)}
.passos li.ok strong{text-decoration:line-through;color:var(--muted)}
.passo-txt{flex:1;min-width:0;display:grid}
.passo-txt span{font-size:14px;color:var(--muted)}
.setup .link{margin-top:10px}

.banner{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--hl-soft);color:var(--text)}
.banner p{margin:0;flex:1;font-size:15px}

/* Cartões de cobrança do dia */
.cobs{display:grid;gap:12px}
.cob{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.cob::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--st,var(--line))}
.cob.st-b-lembrete{--st:var(--ink-2)} .cob.st-b-hoje{--st:var(--amber)} .cob.st-b-atraso,.cob.st-b-firme{--st:var(--red)}
.cob-top{display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px 12px 18px;background:none;border:0;text-align:left}
.cob-amt{font:800 20px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--text)}
.cob-acts{display:grid;grid-template-columns:1fr auto;gap:8px;padding:0 16px 16px 18px}
.cob-acts .btn{min-width:0;padding:0 12px;gap:6px;font-size:15.5px}
.cob-acts .btn svg{width:19px;height:19px}

/* Listas */
.lista{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;background:none;border:0;text-align:left;color:inherit}
.item + .item{border-top:1px solid var(--line)}
.item:hover,.cob-top:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}
.item-main{flex:1;min-width:0;display:grid;gap:1px}
.item-main .chip-st{justify-self:start;margin-top:6px}
.item-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.item-end{display:grid;justify-items:end;gap:5px;flex:none;align-self:flex-start;padding-top:2px}
.item-amt{font:700 17px/1.1 var(--display);font-variant-numeric:tabular-nums}
.vazio{padding:28px 20px;text-align:center;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.vazio .vz-ic{width:52px;height:52px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--green-bg);color:var(--green)}
.vazio .vz-ic svg{width:26px;height:26px}
.vazio p{margin:0;color:var(--muted);font-size:15px}
.vazio p strong{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.vazio .btn{margin-top:14px}

/* Avatares com iniciais */
.av{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font:700 15px/1 var(--display);letter-spacing:.02em;background:var(--a-bg);color:var(--a-fg)}
.av-lg{width:56px;height:56px;font-size:19px}
.a0{--a-bg:#E4EAFD;--a-fg:#2A3F8F} .a1{--a-bg:#DDF2EA;--a-fg:#1C6B4B} .a2{--a-bg:#FCE7DA;--a-fg:#94461C}
.a3{--a-bg:#EFE3FA;--a-fg:#6A3597} .a4{--a-bg:#FDF1C9;--a-fg:#7A5A06} .a5{--a-bg:#DDF0F7;--a-fg:#1D5F78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{--a-bg:color-mix(in srgb,var(--a-fg) 30%,#171E30);--a-fg:#EEF1FA}}
:root[data-theme="dark"] .av{--a-bg:color-mix(in srgb,var(--a-fg) 30%,#171E30);--a-fg:#EEF1FA}

/* Situação */
.chip-st{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.st-lembrete,.st-pend{background:var(--blue-bg);color:var(--ink)}
.st-hoje{background:var(--amber-bg);color:var(--amber)}
.st-atraso,.st-atras{background:var(--red-bg);color:var(--red)}
.st-firme{background:var(--red);color:var(--card)}
.st-paga,.st-pago{background:var(--green-bg);color:var(--green)}
.st-tarde{background:var(--amber-bg);color:var(--amber)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-text);font-weight:700;text-decoration:none;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.wa{background:var(--wa);color:#fff}
.btn.soft{background:var(--blue-bg);color:var(--ink)}
.btn.soft-green{background:var(--green-bg);color:var(--green)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.block{width:100%}
.btn.lg{min-height:56px;font-size:18px;border-radius:16px}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px;border-radius:12px}
.link{background:none;border:0;padding:6px 0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--red)}

/* Busca por valor */
.busca{margin-top:26px}
.busca label{display:block;font-weight:700;color:var(--ink);margin-bottom:8px}
.busca-box{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:2px solid transparent}
.busca-box:focus-within{border-color:var(--focus)}
.busca-box svg{width:20px;height:20px;color:var(--muted)}
.busca-box input{border:0;background:none;min-height:52px;padding:0;flex:1;outline:none;font-size:18px;font-variant-numeric:tabular-nums}
.busca-res{margin-top:10px;display:grid;gap:8px}

/* Segmentos e navegação por período */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.seg{display:flex;gap:4px;margin-top:14px;padding:4px;background:var(--line);border-radius:14px;overflow-x:auto}
.seg button{flex:1;min-height:40px;padding:0 12px;border:0;border-radius:11px;background:none;color:var(--ink-2);font-weight:700;font-size:15px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(24,32,58,.14)}
.gap{margin-top:16px}
.navper{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px}
.navper h2{font-size:22px}
.navper h2::first-letter{text-transform:uppercase}
.navbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.navbtn svg{width:20px;height:20px}

/* Resumo do mês com anel */
.resumo-mes{display:flex;align-items:center;gap:18px;padding:18px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.ring{width:96px;height:96px;flex:none}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8}
.ring-fg{fill:none;stroke:var(--green);stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font:800 15px var(--display);fill:var(--text)}
.resumo-mes dl{margin:0;display:grid;gap:6px;flex:1;min-width:0}
.resumo-mes dl div{display:flex;justify-content:space-between;gap:8px}
.resumo-mes dt{color:var(--muted);font-size:15px}
.resumo-mes dd{margin:0;font:700 16px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.resumo-ano{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resumo-ano div{padding:14px 16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.resumo-ano dt{font-size:14px;color:var(--muted)}
.resumo-ano dd{margin:2px 0 0;font:800 20px var(--display);font-variant-numeric:tabular-nums}

/* Quadro anual */
.grid-wrap{overflow-x:auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin-top:14px}
table.ano{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.ano th,table.ano td{padding:8px 3px;text-align:center}
table.ano tbody tr + tr th,table.ano tbody tr + tr td{border-top:1px solid var(--line)}
table.ano thead th{color:var(--muted);font-weight:700;font-size:12px;padding-top:12px}
table.ano thead th.atual{color:var(--ink)}
table.ano thead th.atual span{background:var(--hl);color:#1F2F6B;border-radius:6px;padding:1px 4px}
table.ano th:first-child,table.ano td:first-child{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding-left:14px;min-width:108px;max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;box-shadow:1px 0 0 var(--line)}
.cel{width:28px;height:28px;border-radius:50%;border:0;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.s-pago{background:var(--green);color:var(--card)}
.s-tarde{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.s-pend{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line)}
.s-atras{background:var(--red);color:var(--card)}
.s-vazio{color:var(--line);cursor:default;background:none}
.legenda{display:flex;flex-wrap:wrap;gap:10px 18px;margin:14px 2px 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.legenda li{display:flex;align-items:center;gap:6px}
.legenda .cel{width:22px;height:22px;font-size:12px;cursor:default}

/* Formulários */
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
.hint{font-weight:400;color:var(--muted);font-size:14px}
input,select,textarea{width:100%;min-height:50px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:400}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);background:var(--card)}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grupo{margin-top:26px;display:grid;gap:12px}
.grupo h2{margin-top:6px}
.grupo-desc{margin:-6px 0 0;color:var(--muted);font-size:15px}
.card-form{display:grid;gap:14px;padding:18px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.opcoes{display:grid;gap:10px}
.opcao{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:2px solid transparent;cursor:pointer;font-weight:400}
.opcao:has(input:checked){border-color:var(--ink)}
.opcao input{width:22px;height:22px;min-height:22px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.opcao span{display:grid;gap:2px}
.opcao strong{font-size:16px}
.opcao span span{font-size:14px;color:var(--muted)}
.switch-row{display:flex;align-items:center;gap:14px;font-weight:400}
.switch-row > span{flex:1;display:grid;gap:2px}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;min-height:32px;padding:0;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.tpl{border-radius:14px;background:var(--bg)}
.tpl summary{padding:14px;font-weight:700;cursor:pointer;list-style-position:inside}
.tpl textarea{border-radius:0 0 14px 14px;border-width:1.5px 0 0}
.form-cli-novo{padding:14px;border-radius:16px;background:var(--blue-bg)}
.valor-box{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding-left:14px}
.valor-box:focus-within{border-color:var(--focus);background:var(--card)}
.valor-box span{font-weight:700;color:var(--muted)}
.valor-box input{border:0;background:none;padding-left:8px}

/* Painel inferior */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,16,35,.5)}
.sheet-panel{position:relative;width:100%;max-width:620px;max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;overflow-x:hidden;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:sobe .24s cubic-bezier(.2,.8,.3,1)}
@keyframes sobe{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.sheet-head h3{margin:0;font:800 22px/1.2 var(--display);color:var(--ink)}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);font-size:24px;line-height:1;flex:none}
.det-head{display:flex;align-items:center;gap:14px}
.det-head > div{flex:1;min-width:0}
.det-head h3{margin:0;font:800 22px/1.2 var(--display);color:var(--ink)}
.det-head p{margin:2px 0 0;color:var(--muted);font-size:15px}
.det-valor{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 4px}
.det-num{font:800 38px/1 var(--display);color:var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.det-meta{margin:0 0 18px;color:var(--muted);font-size:15px}
.rotulo{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink-2)}
.chat{display:grid;gap:6px;padding:14px;border-radius:18px;background:var(--bg);margin-bottom:14px}
.bubble{margin:0;justify-self:end;max-width:92%;padding:10px 12px;border-radius:14px 14px 4px 14px;background:var(--bubble);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:15px;line-height:1.45}
.code{font:13px/1.45 ui-monospace,Consolas,monospace;word-break:break-all;overflow-wrap:anywhere}
.acoes3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.acao{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:0;background:var(--bg);color:var(--ink);font-size:13px;font-weight:700;text-align:center}
.acao svg{width:22px;height:22px}
.qr{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:16px;margin:4px auto 10px;width:fit-content}
#qrbox .code{padding:10px;border-radius:12px;background:var(--bg);margin:0 0 12px}
.hist-box{margin-top:16px;border-radius:16px;background:var(--bg)}
.hist-box summary{padding:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.hist{margin:0;padding:0 14px 12px;list-style:none;color:var(--muted);font-size:15px}
.hist li{padding:6px 0}
.hist li + li{border-top:1px solid var(--line)}
.rodape{display:flex;justify-content:center;gap:28px;margin-top:14px}
.nota{margin:10px 0 0;font-size:14px;color:var(--muted)}
.stack{display:grid;gap:10px}

/* Página de pagamento do cliente */
.pay{max-width:440px;margin:0 auto;padding:16px 0 8px}
.pay-nota{margin:0 0 12px;color:var(--muted);font-size:15px;text-align:center}
.pay-card{padding:24px 20px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);text-align:center}
.pay-card .av{margin:0 auto 10px}
.pay-who{margin:0;color:var(--muted)}
.pay-val{margin:8px 0 6px;font:800 clamp(40px,12vw,54px)/1.1 var(--display);color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pay-desc{margin:0 0 20px;color:var(--muted);font-size:15px}
.pay-passos{margin:18px 0 0;padding:0 0 0 22px;text-align:left;color:var(--muted);font-size:15px;display:grid;gap:4px}
.pay-qr{margin-top:14px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.pay-qr summary{padding:16px 18px;font-weight:700;color:var(--ink);cursor:pointer}
.pay-qr .qr{margin-top:0;margin-bottom:18px}
.pay-foot{margin:22px 0 0;color:var(--muted);font-size:13px;text-align:center}
body.modo-pagar .tabs,body.modo-pagar .fab,body.modo-pagar .date{display:none}
body.modo-pagar main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* Botão flutuante e navegação inferior */
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:6;display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:0 22px 0 18px;border-radius:18px;border:0;background:var(--btn);color:var(--btn-text);font-weight:700;box-shadow:0 10px 24px -8px rgba(31,47,107,.55)}
.fab svg{width:22px;height:22px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;background:none;border:0;color:var(--muted);font-size:12px;min-width:0}
.tabs .ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .2s}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"] .ic{background:var(--hl)}
.tabs button[aria-current="page"] svg{color:#1F2F6B}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){.two{grid-template-columns:1fr}.cob-acts{grid-template-columns:1fr}}
</style>

<body>
<header class="top"><div class="wrap"><div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="5" y="3" width="18" height="22" rx="3.5" fill="#FFE14D"/><rect x="5" y="3" width="18" height="22" rx="3.5" fill="none" stroke="#1F2F6B" stroke-width="2"/><path d="M10 10h8M10 14h8M10 18h5" stroke="#1F2F6B" stroke-width="2" stroke-linecap="round"/><path d="M5 8H3M5 14H3M5 20H3" stroke="#1F2F6B" stroke-width="2" stroke-linecap="round"/></svg>Caderninho</div><div class="date" id="topdate"></div></div></header>
<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Seções"><div class="wrap">
  <button data-tab="hoje"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Hoje</button>
  <button data-tab="cobrancas"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg></span>Cobranças</button>
  <button data-tab="clientes"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg></span>Clientes</button>
  <button data-tab="meses"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14.5l2 2 4-4"/></svg></span>Meses</button>
  <button data-tab="ajustes"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>Ajustes</button>
</div></nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" data-action="close"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div id="sheet-body"></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- Constantes e utilidades ---------- */
const KEY = 'caderninho.v1';
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.5 2.5 0 0 0 1.7-1.2 2 2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>';

const AVISO = "Vou mandar o código Pix na próxima mensagem. É só tocar e segurar nele, escolher Copiar e colar no app do seu banco, na opção Pix copia e cola.";
const INSTR_LINK = "Para pagar, toque no link abaixo e depois em Copiar código Pix. Em seguida, cole no app do seu banco, na opção Pix copia e cola. Se preferir, a página também mostra o QR Code.\n{link}";
const DEFAULT_T = {
  lembrete: "Oi, {nome}! Tudo bem? Passando para lembrar que o pagamento referente a {descricao} ({valor}) vence em {vencimento}.\n\n{instrucoes}\n\nObrigado!",
  hoje: "Oi, {nome}! Hoje é o vencimento do pagamento referente a {descricao} ({valor}).\n\n{instrucoes}\n\nSe já pagou, pode desconsiderar.",
  atraso: "Oi, {nome}, tudo certo? O pagamento referente a {descricao} ({valor}) venceu em {vencimento} e ainda não localizei. Se já pagou, me mande o comprovante, por favor.\n\n{instrucoes}",
  firme: "Olá, {nome}. O pagamento referente a {descricao}, no valor de {valor}, está em aberto desde {vencimento} ({dias} dias). Preciso que seja regularizado. Se estiver com alguma dificuldade, me avise para combinarmos.\n\n{instrucoes}"
};
const TPL_VERSAO = 4;
const ETAPA_NOME = {lembrete:'Lembrete antes do vencimento', hoje:'No dia do vencimento', atraso:'Atraso leve (1 a 6 dias)', firme:'Atraso firme (7 dias ou mais)'};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2,8)).toUpperCase();
const money = cents => BRL.format((cents||0)/100);
function parseMoney(s){
  s = String(s||'').replace(/[^\d,.]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const v = Math.round(parseFloat(s)*100);
  return Number.isFinite(v) && v > 0 ? v : null;
}
const pad = n => String(n).padStart(2,'0');
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function toStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(s,n){ const d = parseD(s); d.setDate(d.getDate()+n); return toStr(d); }
function diffDays(a,b){ return Math.round((parseD(a) - parseD(b)) / 864e5); }
function fmtD(s){ const [y,m,d] = s.split('-'); return `${d}/${m}`; }
function fmtDLong(s){ const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; }
const monthRef = s => s.slice(0,7);
const firstName = n => String(n||'').trim().split(/\s+/)[0] || '';
const plural = (n, a, b) => n === 1 ? a : b;

/* ---------- Estado (salvo neste aparelho) ---------- */
function fresh(){ return {settings:{nome:'',cidade:'',pixTipo:'cpf',pixChave:'',linkBase:'',centavosId:true,tplVersao:TPL_VERSAO,templates:{...DEFAULT_T}}, clientes:[], cobrancas:[]}; }
let saveWarned = false;
function load(){
  try { const r = localStorage.getItem(KEY); if (r) { const s = JSON.parse(r); s.settings.templates = {...DEFAULT_T, ...(s.settings.templates||{})}; if (s.settings.centavosId === undefined) s.settings.centavosId = true; if ((s.settings.tplVersao||0) < TPL_VERSAO){ s.settings.templates = {...DEFAULT_T}; s.settings.tplVersao = TPL_VERSAO; } return s; } } catch(e){}
  return fresh();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ if(!saveWarned){ saveWarned = true; toast('Este navegador não permite salvar. Os dados valem até fechar a página.'); } }
}
let state = load();
/* Quando o app roda num endereço público (ex.: GitHub Pages), já usa esse endereço para o link de pagamento */
(function autoLink(){
  try {
    if (!state.settings.linkBase && location.protocol === 'https:' && /\.github\.io$/.test(location.hostname)){
      state.settings.linkBase = location.origin + location.pathname.replace(/index\.html$/,'');
      save();
    }
  } catch(e){}
})();
let tab = 'hoje';
let filtro = 'abertas';
let vistaMeses = 'mes';
let mesSel = monthRef(todayStr());
let anoSel = Number(todayStr().slice(0,4));

/* ---------- Pix (BR Code estático, padrão EMV do Banco Central) ---------- */
function crc16(str){ let crc = 0xFFFF; for (let i=0;i<str.length;i++){ crc ^= str.charCodeAt(i) << 8; for (let j=0;j<8;j++){ crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; } } return crc.toString(16).toUpperCase().padStart(4,'0'); }
const tlv = (id, v) => id + String(v.length).padStart(2,'0') + v;
const ascii = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').trim();
function pixKey(){
  const {pixTipo, pixChave} = state.settings; const k = String(pixChave||'').trim();
  if (!k) return '';
  if (pixTipo === 'cpf') return k.replace(/\D/g,'');
  if (pixTipo === 'celular'){ let d = k.replace(/\D/g,''); if (!d.startsWith('55')) d = '55' + d; return '+' + d; }
  if (pixTipo === 'email') return k.toLowerCase();
  return k;
}
function pixPayload(cents, txid){
  const key = pixKey(); if (!key) return '';
  const nome = ascii(state.settings.nome).slice(0,25) || 'RECEBEDOR';
  const cidade = ascii(state.settings.cidade).toUpperCase().slice(0,15) || 'BRASIL';
  const tx = (String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25)) || '***';
  const p = tlv('00','01') + tlv('26', tlv('00','br.gov.bcb.pix') + tlv('01', key)) + tlv('52','0000') + tlv('53','986')
          + tlv('54', (cents/100).toFixed(2)) + tlv('58','BR') + tlv('59', nome) + tlv('60', cidade) + tlv('62', tlv('05', tx)) + '6304';
  return p + crc16(p);
}

/* ---------- Regras de cobrança ---------- */
/* Centavos de identificação: cada cobrança em aberto ganha um valor único (ex.: 250,03) para saber quem pagou pelo extrato */
function centavosUnicos(base, ignorarId){
  if (!state.settings.centavosId) return {valor: base, idc: 0};
  const usados = new Set(state.cobrancas.filter(c => c.status !== 'paga' && c.id !== ignorarId).map(c => c.valor));
  for (let k = 1; k < 100; k++) if (!usados.has(base + k)) return {valor: base + k, idc: k};
  return {valor: base, idc: 0};
}
const cliente = id => state.clientes.find(c => c.id === id);
const abertas = () => state.cobrancas.filter(c => c.status !== 'paga');
function info(c){
  if (c.status === 'paga') return {etapa:'paga', label:`Paga em ${fmtD(c.pagaEm)}`, dias:0};
  const d = diffDays(todayStr(), c.venc);
  if (d < 0) return {etapa:'lembrete', label:`Vence em ${-d} ${plural(-d,'dia','dias')}`, dias:d};
  if (d === 0) return {etapa:'hoje', label:'Vence hoje', dias:0};
  return {etapa: d < 7 ? 'atraso' : 'firme', label:`Atrasada há ${d} ${plural(d,'dia','dias')}`, dias:d};
}
/* Régua: 2 dias antes, no dia, 3 e 7 dias depois, e depois a cada 7 dias */
function precisaCobrar(c){
  if (c.status === 'paga') return false;
  const d = diffDays(todayStr(), c.venc);
  if (d < -2) return false;
  let p = -2;
  for (const q of [-2,0,3,7]) if (q <= d) p = q;
  if (d >= 14) p = Math.floor(d/7)*7;
  const ponto = addDays(c.venc, p);
  const ultimo = (c.contatos||[]).map(x => x.data).sort().pop();
  return !ultimo || ultimo < ponto;
}
function mensagem(c){
  const cl = cliente(c.clienteId) || {}; const i = info(c);
  const etapa = i.etapa === 'paga' ? 'hoje' : i.etapa;
  const t = state.settings.templates[etapa] || DEFAULT_T[etapa];
  const pix = pixPayload(c.valor, c.id) || '(cadastre sua chave Pix em Ajustes)';
  const link = linkPagamento(c);
  const temPix = !!pixPayload(c.valor, c.id);
  const instr = !temPix ? '(cadastre sua chave Pix em Ajustes)' : (modoEnvio() === 'link' && link ? INSTR_LINK : AVISO);
  let base = t.replaceAll('{instrucoes}', instr);
  if (!link) base = base.split('\n').filter(l => !l.includes('{link}')).join('\n').replace(/\n{3,}/g,'\n\n');
  return base.replaceAll('{link}', link).replaceAll('{nome}', firstName(cl.nome)).replaceAll('{valor}', money(c.valor)).replaceAll('{descricao}', c.descricao)
          .replaceAll('{vencimento}', fmtDLong(c.venc)).replaceAll('{dias}', Math.max(i.dias,0)).replaceAll('{pix}', pix);
}
/* Página de pagamento: os dados vão no próprio link (#pagar=...), sem servidor */
function b64url(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function dadosPagamento(c){ return {p: pixPayload(c.valor, c.id), n: state.settings.nome, d: c.descricao, v: c.valor, e: c.venc}; }
function linkBaseAuto(){ const b = String(state.settings.linkBase||'').trim(); if (b) return b; return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : ''; }
function modoEnvio(){ return (state.settings.envio === 'duas' || !linkBaseAuto()) ? 'duas' : 'link'; }
function linkPagamento(c){
  const base = linkBaseAuto(); const pix = pixPayload(c.valor, c.id);
  if (!base || !pix) return '';
  return base.split('#')[0] + '#pagar=' + b64url(JSON.stringify(dadosPagamento(c)));
}
function paginaPagamento(d, preview){
  return `<div class="pay">
    ${preview ? '<p class="pay-nota">É assim que seu cliente vê a página ao tocar no link.</p>' : ''}
    <div class="pay-card">
      ${avatar(d.n, true)}
      <p class="pay-who">${esc(d.n)} está cobrando</p>
      <p class="pay-val"><span class="hl">${money(d.v)}</span></p>
      <p class="pay-desc">${esc(d.d)}. Vencimento em ${fmtDLong(d.e)}</p>
      <button class="btn wa block lg" data-action="copy-raw" data-code="${esc(d.p)}">${ICON.copy}Copiar código Pix</button>
      <ol class="pay-passos"><li>Toque em Copiar código Pix</li><li>Abra o app do seu banco e escolha Pix</li><li>Use a opção Pix copia e cola e confirme</li></ol>
    </div>
    <details class="pay-qr"><summary>Prefiro pagar com QR Code</summary><div class="qr" id="payqr"></div></details>
    ${preview ? '' : '<p class="pay-foot">Cobrança organizada com o Caderninho</p>'}
  </div>`;
}
function desenharQR(el, code){
  if (!el) return;
  if (typeof QRCode === 'function') new QRCode(el, {text:code, width:220, height:220, correctLevel:QRCode.CorrectLevel.M});
  else el.outerHTML = '<p class="row-sub">Não foi possível desenhar o QR Code. Use o botão de copiar.</p>';
}

function waPixLink(c){
  const cl = cliente(c.clienteId) || {}; let f = String(cl.fone||'').replace(/\D/g,'');
  if (f && !f.startsWith('55')) f = '55' + f;
  return `https://wa.me/${f}?text=${encodeURIComponent(pixPayload(c.valor, c.id))}`;
}
function sheetPasso2(c){
  const pix = pixPayload(c.valor, c.id);
  openSheet(`${head('Agora envie o código Pix')}
    <div class="stack">
      <p style="margin:0">O WhatsApp aceita uma mensagem por vez. Mandando o código sozinho, seu cliente toca e segura, escolhe Copiar e cola direto no banco.</p>
      <div class="chat"><p class="bubble code">${esc(pix)}</p></div>
      <a class="btn wa block lg" href="${esc(waPixLink(c))}" target="_blank" rel="noopener" data-action="wa-pix" data-id="${c.id}">${WA_ICON}Enviar código Pix</a>
      <button class="btn soft block" data-action="close">Agora não</button>
    </div>`);
}
function waLink(c){
  const cl = cliente(c.clienteId) || {}; let f = String(cl.fone||'').replace(/\D/g,'');
  if (f && !f.startsWith('55')) f = '55' + f;
  return `https://wa.me/${f}?text=${encodeURIComponent(mensagem(c))}`;
}
function mensalidadesPendentes(){
  const ref = monthRef(todayStr());
  return state.clientes.filter(cl => cl.mensalidade > 0 && cl.dia && !state.cobrancas.some(c => c.clienteId === cl.id && c.ref === ref));
}
function gerarMensalidades(){
  const hoje = parseD(todayStr()); const y = hoje.getFullYear(), m = hoje.getMonth();
  const ultimoDia = new Date(y, m+1, 0).getDate(); const ref = monthRef(todayStr());
  const lista = mensalidadesPendentes();
  lista.forEach(cl => { const u = centavosUnicos(cl.mensalidade); state.cobrancas.push({id:uid(), clienteId:cl.id, descricao:`Mensalidade de ${MESES[m]}`, valor:u.valor, idc:u.idc,
    venc:`${y}-${pad(m+1)}-${pad(Math.min(cl.dia, ultimoDia))}`, status:'aberta', contatos:[], ref}); });
  save(); render(); toast(`${lista.length} ${plural(lista.length,'mensalidade gerada','mensalidades geradas')}`);
}

/* ---------- Componentes ---------- */

};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function hashN(s){ let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
function avatar(nome, big){

const chip = (st, label) => `<span class="chip-st st-${st}">${esc(label)}</span>`;
function itemCob(c){

const ledger = (items, acoes, msg) => items.length ? `<div class="lista">${items.map(itemCob).join('')}</div>` : (msg ? vazio('Nada por aqui', msg) : '');
const byVenc = (a,b) => a.venc.localeCompare(b.venc);

/* ---------- Telas ---------- */
let heroAnimado = false;
function saudacao(){ const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function vHoje(){
  const hoje = todayStr(); const ab = abertas(); const m = parseD(hoje).getMonth();
  const total = ab.reduce((s,c) => s + c.valor, 0);
  const atrasadas = ab.filter(c => diffDays(hoje, c.venc) > 0);
  const semana = ab.filter(c => { const d = diffDays(c.venc, hoje); return d >= 0 && d <= 7; });
  const doMes = state.cobrancas.filter(c => monthRef(c.venc) === monthRef(hoje));
  const cobradoMes = doMes.reduce((s,c) => s + c.valor, 0);
  const recebidoMes = doMes.filter(c => c.status === 'paga').reduce((s,c) => s + c.valor, 0);
  const pct = cobradoMes ? Math.round(recebidoMes / cobradoMes * 100) : 0;
  const cobrar = ab.filter(precisaCobrar).sort(byVenc);
  const proximos = ab.filter(c => !cobrar.includes(c) && diffDays(c.venc, hoje) >= 0 && diffDays(c.venc, hoje) <= 7).sort(byVenc);
  const nome = firstName(state.settings.nome);
  const anim = !heroAnimado; heroAnimado = true;

  let h = `<section class="hero${anim ? ' anim' : ''}">
    <p class="ola">${saudacao()}${nome ? ', ' + esc(nome) : ''}!</p>
    <p class="hero-label">Para receber</p>
    <p class="hero-num"><span class="hl">${money(total)}</span></p>
    <div class="pills">
      ${atrasadas.length ? `<button class="pill p-red" data-action="ver-atrasadas">${atrasadas.length} ${plural(atrasadas.length,'atrasada','atrasadas')}, ${money(atrasadas.reduce((s,c) => s + c.valor, 0))}</button>` : (ab.length ? '<span class="pill p-green">Nada em atraso</span>' : '')}
      ${semana.length ? `<span class="pill">${semana.length} ${plural(semana.length,'vence','vencem')} nos próximos 7 dias</span>` : ''}
    </div>
    ${cobradoMes ? `<div class="mes-prog"><div class="barra" role="img" aria-label="${pct}% recebido"><span style="width:${pct}%"></span></div>
      <p>${cap(MESES[m])}: <strong>${money(recebidoMes)}</strong> recebidos de ${money(cobradoMes)}</p></div>` : ''}
  </section>`;

  const passos = [
    [!!state.settings.pixChave, 'Cadastre sua chave Pix', 'Assim o código de pagamento sai pronto nas mensagens.', 'data-action="goto" data-tab="ajustes"', 'Cadastrar'],
    [state.clientes.length > 0, 'Adicione seu primeiro cliente', 'Nome e WhatsApp já bastam.', 'data-action="new-client"', 'Adicionar'],
    [state.cobrancas.length > 0, 'Crie sua primeira cobrança', 'Informe o valor e o vencimento.', 'data-action="new-charge"', 'Criar']
  ];
  if (passos.some(p => !p[0])){
    h += `<section class="setup"><h2>Primeiros passos</h2><ol class="passos">${passos.map(([ok,t,d,a,b], i) => `<li class="${ok ? 'ok' : ''}">
      <span class="passo-n">${ok ? ICON.check : i + 1}</span><span class="passo-txt"><strong>${t}</strong><span>${d}</span></span>
      ${ok ? '' : `<button class="btn soft sm" ${a}>${b}</button>`}</li>`).join('')}</ol>
      ${state.clientes.length ? '' : '<button class="link" data-action="demo">Prefiro ver com dados de exemplo</button>'}</section>`;
  }
  const pend = mensalidadesPendentes();
  if (pend.length){
    h += `<div class="banner"><p><strong>${pend.length} ${plural(pend.length,'mensalidade','mensalidades')} de ${MESES[m]}</strong> ainda ${plural(pend.length,'não foi criada','não foram criadas')}.</p>
      <button class="btn sm" data-action="gen">Criar agora</button></div>`;
  }
  if (state.cobrancas.length){
    h += `<div class="sec-head"><h2>Cobrar hoje</h2>${cobrar.length ? `<span class="count">${cobrar.length}</span>` : ''}</div>`;
    h += cobrar.length ? `<div class="cobs">${cobrar.map(cardCobrar).join('')}</div>`
      : vazio('Tudo em dia por hoje', 'As cobranças aparecem aqui 2 dias antes do vencimento, no dia e quando atrasam.');
  }
  if (ab.length) h += `<div class="busca"><label for="busca">Recebeu um Pix? Ache quem pagou pelo valor</label>
    <div class="busca-box">${ICON.search}<input id="busca" inputmode="decimal" placeholder="Ex.: 250,03" autocomplete="off"></div><div class="busca-res" id="busca-res"></div></div>`;
  if (proximos.length) h += `<div class="sec-head"><h2>Próximos 7 dias</h2></div>` + ledger(proximos, false, '');
  return h;
}
function resultadosBusca(q){
  const alvo = parseMoney(q); if (!alvo) return '';
  const exatos = abertas().filter(c => c.valor === alvo);
  if (exatos.length) return ledger(exatos, false, '') + exatos.map(c => `<button class="btn soft-green block" data-action="paid" data-id="${c.id}">${ICON.check}Marcar ${esc(firstName((cliente(c.clienteId)||{}).nome))} como recebido</button>`).join('');
  const reais = abertas().filter(c => Math.floor(c.valor/100) === Math.floor(alvo/100));
  return `<p class="small">Nenhuma cobrança em aberto com exatamente ${money(alvo)}.${reais.length ? ' Valores parecidos:' : ''}</p>${reais.length ? ledger(reais, false, '') : ''}`;
}

/* ---------- Meses e ano ---------- */
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ST_ROTULO = {pago:'Pagou em dia', tarde:'Pagou com atraso', pend:'A vencer', atras:'Não pagou'};
const ST_SIMB = {pago:'✓', tarde:'✓', pend:'', atras:'!'};
function statusMes(clienteId, ref){
  const cs = state.cobrancas.filter(c => c.clienteId === clienteId && monthRef(c.venc) === ref);
  if (!cs.length) return null;
  const hoje = todayStr(); const total = cs.reduce((s,c) => s + c.valor, 0);
  const abertasM = cs.filter(c => c.status !== 'paga');
  if (!abertasM.length){
    const pagaEm = cs.map(c => c.pagaEm).sort().pop();
    const atrasoMax = Math.max(...cs.map(c => diffDays(c.pagaEm, c.venc)));
    return {s: atrasoMax > 0 ? 'tarde' : 'pago', cs, total, pagaEm, atrasoMax};
  }
  const diasAtraso = Math.max(...abertasM.map(c => diffDays(hoje, c.venc)));
  return {s: diasAtraso > 0 ? 'atras' : 'pend', cs, total, abertasM, diasAtraso, venc: abertasM.map(c => c.venc).sort()[0]};
}
function textoStatus(st){
  const n = st.cs.length, pagas = n - (st.abertasM ? st.abertasM.length : 0);
  const pre = n > 1 ? `${pagas} de ${n} pagas. ` : '';
  if (st.s === 'pago') return pre + `Pagou em ${fmtD(st.pagaEm)}`;
  if (st.s === 'tarde') return pre + `Pagou em ${fmtD(st.pagaEm)}, ${st.atrasoMax} ${plural(st.atrasoMax,'dia','dias')} depois do vencimento`;
  if (st.s === 'atras') return pre + `Em atraso há ${st.diasAtraso} ${plural(st.diasAtraso,'dia','dias')}`;
  return pre + (st.venc === todayStr() ? 'Vence hoje' : `Vence em ${fmtD(st.venc)}`);
}
function nomeMes(ref){ const [y,m] = ref.split('-').map(Number); return `${MESES[m-1]} de ${y}`; }
function mudarMes(delta){ const [y,m] = mesSel.split('-').map(Number); const d = new Date(y, m-1+delta, 1); mesSel = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function linhaCliente(cl, st){
  return `<button class="item" data-action="open-client" data-id="${cl.id}">${avatar(cl.nome)}
    <span class="item-main"><span class="item-name">${esc(cl.nome)}</span><span class="item-sub">${esc(textoStatus(st))}</span>${chip(st.s, ST_ROTULO[st.s])}</span>
    <span class="item-end"><span class="item-amt">${money(st.total)}</span></span></button>`;
}
function anel(pct){
  const r = 27, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 64 64" role="img" aria-label="${pct}% recebido"><circle cx="32" cy="32" r="${r}" class="ring-bg"/>
    ${pct ? `<circle cx="32" cy="32" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct/100)).toFixed(1)}"/>` : ''}
    <text x="32" y="37" text-anchor="middle">${pct}%</text></svg>`;
}
function vMeses(){
  return `<div class="page-head"><h1>Meses</h1></div>
    <div class="seg" role="group" aria-label="Visão"><button data-action="vista" data-v="mes" aria-pressed="${vistaMeses==='mes'}">Por mês</button><button data-action="vista" data-v="ano" aria-pressed="${vistaMeses==='ano'}">Ano inteiro</button></div>`
    + (vistaMeses === 'mes' ? vMes() : vAno());
}
function vMes(){
  const ref = mesSel;
  const cs = state.cobrancas.filter(c => monthRef(c.venc) === ref);
  const cobrado = cs.reduce((s,c) => s + c.valor, 0);
  const recebido = cs.filter(c => c.status === 'paga').reduce((s,c) => s + c.valor, 0);
  const pct = cobrado ? Math.round(recebido / cobrado * 100) : 0;
  const linhas = [...new Set(cs.map(c => c.clienteId))].map(id => ({cl: cliente(id) || {id, nome:'Cliente removido'}, st: statusMes(id, ref)}))
    .sort((a,b) => a.cl.nome.localeCompare(b.cl.nome,'pt-BR'));
  const nao = linhas.filter(x => x.st.s === 'atras' || x.st.s === 'pend').sort((a,b) => (b.st.s === 'atras') - (a.st.s === 'atras'));
  const sim = linhas.filter(x => x.st.s === 'pago' || x.st.s === 'tarde');
  let h = `<div class="navper"><button class="navbtn" data-action="mes-prev" aria-label="Mês anterior">${ICON.left}</button><h2>${nomeMes(ref)}</h2><button class="navbtn" data-action="mes-next" aria-label="Próximo mês">${ICON.right}</button></div>`;
  if (!cs.length) return h + vazio('Nenhuma cobrança neste mês', 'Use as setas para ver outros meses.');
  h += `<div class="resumo-mes">${anel(pct)}<dl>
      <div><dt>Cobrado</dt><dd>${money(cobrado)}</dd></div>
      <div><dt>Recebido</dt><dd class="c-green">${money(recebido)}</dd></div>
      <div><dt>Pendente</dt><dd class="c-red">${money(cobrado - recebido)}</dd></div>
      <div><dt>Pagaram</dt><dd>${sim.length} de ${linhas.length} ${plural(linhas.length,'cliente','clientes')}</dd></div></dl></div>`;
  h += `<div class="sec-head"><h2>Não pagaram</h2><span class="count">${nao.length}</span></div>`;
  h += nao.length ? `<div class="lista">${nao.map(x => linhaCliente(x.cl, x.st)).join('')}</div>` : vazio('Todo mundo pagou', 'Nenhuma pendência neste mês.');
  h += `<div class="sec-head"><h2>Pagaram</h2><span class="count">${sim.length}</span></div>`;
  h += sim.length ? `<div class="lista">${sim.map(x => linhaCliente(x.cl, x.st)).join('')}</div>` : `<p class="small">Ninguém pagou ainda neste mês.</p>`;
  return h;
}
function vAno(){
  const y = anoSel; const refs = MES_CURTO.map((_,i) => `${y}-${pad(i+1)}`);
  const doAno = state.cobrancas.filter(c => c.venc.startsWith(y + '-'));
  const cls = [...new Set(doAno.map(c => c.clienteId))].map(id => cliente(id) || {id, nome:'Cliente removido'}).sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  const recebido = doAno.filter(c => c.status === 'paga').reduce((s,c) => s + c.valor, 0);
  const pendente = doAno.filter(c => c.status !== 'paga').reduce((s,c) => s + c.valor, 0);
  const atual = monthRef(todayStr());
  let h = `<div class="navper"><button class="navbtn" data-action="ano-prev" aria-label="Ano anterior">${ICON.left}</button><h2>${y}</h2><button class="navbtn" data-action="ano-next" aria-label="Próximo ano">${ICON.right}</button></div>`;
  if (!cls.length) return h + vazio(`Nenhuma cobrança em ${y}`, 'Use as setas para ver outros anos.');
  h += `<dl class="resumo-ano"><div><dt>Recebido no ano</dt><dd class="c-green">${money(recebido)}</dd></div><div><dt>Pendente</dt><dd class="c-red">${money(pendente)}</dd></div></dl>`;
  h += `<div class="grid-wrap"><table class="ano"><thead><tr><th scope="col">Cliente</th>${MES_CURTO.map((m,i) => `<th scope="col" class="${refs[i]===atual?'atual':''}"><span>${m}</span></th>`).join('')}</tr></thead><tbody>`;
  h += cls.map(cl => `<tr><th scope="row">${esc(cl.nome)}</th>${refs.map((ref,i) => {
      const st = statusMes(cl.id, ref);
      if (!st) return `<td><span class="cel s-vazio" aria-label="${MES_CURTO[i]}: sem cobrança">·</span></td>`;
      return `<td><button class="cel s-${st.s}" data-action="abrir-mes" data-ref="${ref}" title="${esc(MES_CURTO[i] + ': ' + ST_ROTULO[st.s])}" aria-label="${esc(cl.nome + ', ' + MES_CURTO[i] + ': ' + ST_ROTULO[st.s])}">${ST_SIMB[st.s]}</button></td>`;
    }).join('')}</tr>`).join('');
  h += `</tbody></table></div>
    <ul class="legenda"><li><span class="cel s-pago">✓</span>Pagou em dia</li><li><span class="cel s-tarde">✓</span>Pagou com atraso</li><li><span class="cel s-atras">!</span>Não pagou</li><li><span class="cel s-pend"></span>A vencer</li></ul>
    <p class="nota">Toque em um mês para ver os detalhes.</p>`;
  return h;
}

    </div>
    <div class="card-form">
      <label>Endereço da página de pagamento<span class="hint">Opcional: se ficar vazio, o app usa o endereço em que está aberto agora.</span><input name="linkBase" type="url" inputmode="url" placeholder="https://seunome.github.io/caderninho/" value="${esc(s.linkBase||'')}"></label>
      <label class="switch-row"><span><strong>Centavos de identificação</strong><span class="hint">Cada cobrança ganha centavos únicos, como R$ 250,03, para você saber quem pagou só de olhar o extrato.</span></span><input type="checkbox" class="switch" name="centavosId" ${s.centavosId ? 'checked' : ''}></label>
    </div>
    <button class="btn block lg" type="submit">Salvar dados</button>
  </form>
  <form class="grupo" data-form="templates">
    <h2>Mensagens de cobrança</h2>
    <p class="grupo-desc">O app escolhe a mensagem certa pela situação. Você pode usar {nome}, {valor}, {descricao}, {vencimento}, {dias} e {instrucoes}, que vira o texto de como pagar.</p>
    <div class="card-form">${Object.keys(DEFAULT_T).map(k => `<details class="tpl"><summary>${ETAPA_NOME[k]}</summary><textarea name="${k}" aria-label="${esc(ETAPA_NOME[k])}">${esc(t[k])}</textarea></details>`).join('')}</div>
    <div class="two"><button class="btn" type="submit">Salvar mensagens</button><button class="btn soft" type="button" data-action="reset-t">Restaurar padrão</button></div>
  </form>
  <section class="grupo"><h2>Dados deste aparelho</h2><p class="grupo-desc">Tudo fica salvo só neste navegador, sem servidor. Versão 2 · envio com link.</p>
    <div class="two"><button class="btn soft" data-action="demo">Carregar exemplo</button><button class="btn danger" data-action="wipe">Apagar tudo</button></div></section>`;
}

/* ---------- Painéis (sheets) ---------- */
function openSheet(html){ $('#sheet-body').innerHTML = html; $('#sheet').hidden = false; const f = $('#sheet-body').querySelector('input,select,textarea'); f && f.focus(); }
function closeSheet(){ $('#sheet').hidden = true; $('#sheet-body').innerHTML = ''; }
const X_BTN = `<button class="x" data-action="close" aria-label="Fechar">×</button>`;
const head = t => `<div class="grab" aria-hidden="true"></div><div class="sheet-head"><h3 id="sheet-title">${t}</h3>${X_BTN}</div>`;

function sheetCharge(id){
  const c = state.cobrancas.find(x => x.id === id); if (!c) return;
  const cl = cliente(c.clienteId) || {nome:'Cliente removido'}; const i = info(c); const pix = pixPayload(c.valor, c.id);
  const duas = modoEnvio() === 'duas';
  const hist = (c.contatos||[]).slice().reverse();
  openSheet(`<div class="grab" aria-hidden="true"></div>
    <div class="det-head">${avatar(cl.nome, true)}<div><h3 id="sheet-title">${esc(cl.nome)}</h3><p>${esc(c.descricao)}</p></div>${X_BTN}</div>
    <div class="det-valor"><span class="det-num">${money(c.valor)}</span>${chip(i.etapa, i.label)}</div>
    <p class="det-meta">Vencimento em ${fmtDLong(c.venc)}${c.idc ? `. Inclui ${money(c.idc)} para identificar o pagamento` : ''}</p>
    ${c.status !== 'paga' ? `
      <p class="rotulo">${duas ? 'O cliente vai receber estas duas mensagens' : 'O cliente vai receber esta mensagem'}</p>
      <div class="chat"><p class="bubble">${esc(mensagem(c))}</p>${pix && duas ? `<p class="bubble code">${esc(pix)}</p>` : ''}</div>
      <a class="btn wa block lg" href="${esc(waLink(c))}" target="_blank" rel="noopener" data-action="wa" data-id="${c.id}">${WA_ICON}Enviar no WhatsApp</a>
      ${pix ? `<div class="acoes3"><button class="acao" data-action="copy" data-id="${c.id}">${ICON.copy}Copiar Pix</button><button class="acao" data-action="qr" data-id="${c.id}">${ICON.qr}QR Code</button><button class="acao" data-action="pay-preview" data-id="${c.id}">${ICON.eye}Página do cliente</button></div><div id="qrbox"></div>` : ''}
      <button class="btn soft-green block" data-action="paid" data-id="${c.id}">${ICON.check}Marcar como recebido</button>`
    : `<button class="btn soft block" data-action="unpaid" data-id="${c.id}">Reabrir cobrança</button>`}
    ${hist.length ? `<details class="hist-box"><summary>Cobrado ${hist.length} ${plural(hist.length,'vez','vezes')}</summary><ul class="hist">${hist.map(x => `<li>${fmtDLong(x.data)}: ${esc((ETAPA_NOME[x.etapa] || x.etapa).toLowerCase())}</li>`).join('')}</ul></details>` : ''}
    <div class="rodape"><button class="link" data-action="edit-charge" data-id="${c.id}">Editar</button><button class="link danger" data-action="del-charge" data-id="${c.id}">Excluir</button></div>`);
}
function sheetChargeForm(id){
  const c = id ? state.cobrancas.find(x => x.id === id) : null;
  const opts = [...state.clientes].sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'))
    .map(cl => `<option value="${cl.id}" ${c && c.clienteId===cl.id ? 'selected':''}>${esc(cl.nome)}</option>`).join('');
  const semCliente = !state.clientes.length;
  openSheet(`${head(c ? 'Editar cobrança' : 'Nova cobrança')}
    <form data-form="charge" data-id="${c ? c.id : ''}">
      <label>Cliente<select name="clienteId">${opts}<option value="__novo" ${semCliente?'selected':''}>+ Cadastrar novo cliente</option></select></label>
      <div id="novo-cli" ${semCliente ? '' : 'hidden'} class="two form-cli-novo"><label>Nome<input name="novoNome"></label><label>WhatsApp<input name="novoFone" inputmode="tel" placeholder="61 99999-9999"></label></div>
      <label>Referente a<input name="descricao" required value="${esc(c ? c.descricao : '')}" placeholder="Aula de outubro, conserto, diária"></label>
      <div class="two"><label>Valor<div class="valor-box"><span>R$</span><input name="valor" required inputmode="decimal" placeholder="150,00" value="${c ? ((c.valor - (c.idc||0))/100).toFixed(2).replace('.',',') : ''}"></div></label>
      <label>Vencimento<input name="venc" type="date" required value="${c ? c.venc : todayStr()}"></label></div>
      <button class="btn block lg" type="submit">${c ? 'Salvar cobrança' : 'Criar cobrança'}</button>
    </form>`);
}
function sheetClient(id){
  const cl = id ? cliente(id) : null;
  const deles = cl ? state.cobrancas.filter(c => c.clienteId === cl.id).sort((a,b) => b.venc.localeCompare(a.venc)) : [];
  openSheet(`${cl ? `<div class="grab" aria-hidden="true"></div><div class="det-head" style="margin-bottom:18px">${avatar(cl.nome, true)}<div><h3 id="sheet-title">${esc(cl.nome)}</h3><p>${esc(cl.fone)}</p></div>${X_BTN}</div>` : head('Novo cliente')}
    <form data-form="client" data-id="${cl ? cl.id : ''}">
      <label>Nome<input name="nome" required value="${esc(cl ? cl.nome : '')}"></label>
      <label>WhatsApp<span class="hint">Com DDD, por exemplo 61 99999-9999</span><input name="fone" required inputmode="tel" value="${esc(cl ? cl.fone : '')}"></label>
      <div class="two"><label>Mensalidade<span class="hint">Opcional</span><div class="valor-box"><span>R$</span><input name="mensalidade" inputmode="decimal" placeholder="0,00" value="${cl && cl.mensalidade ? (cl.mensalidade/100).toFixed(2).replace('.',',') : ''}"></div></label>
      <label>Todo dia<span class="hint">Vencimento</span><input name="dia" type="number" min="1" max="31" placeholder="10" value="${cl && cl.dia ? cl.dia : ''}"></label></div>
      <button class="btn block lg" type="submit">${cl ? 'Salvar cliente' : 'Cadastrar cliente'}</button>
    </form>
    ${cl ? `<div class="sec-head"><h2>Cobranças</h2><span class="count">${deles.length}</span></div>${deles.length ? ledger(deles, false, '') : '<p class="small">Nenhuma cobrança ainda.</p>'}
      <div class="rodape"><button class="link danger" data-action="del-client" data-id="${cl.id}">Excluir cliente e suas cobranças</button></div>` : ''}`);
}

/* ---------- Ações ---------- */
function marcarPago(id){ const c = state.cobrancas.find(x => x.id === id); if (!c) return; c.status = 'paga'; c.pagaEm = todayStr(); save(); closeSheet(); render(); toast(`${money(c.valor)} recebido`); }
function registrarContato(id){ const c = state.cobrancas.find(x => x.id === id); if (!c) return; (c.contatos ||= []).push({data: todayStr(), etapa: info(c).etapa}); save();
  setTimeout(() => { render(); if (pixPayload(c.valor, c.id) && modoEnvio() === 'duas') sheetPasso2(c); else { closeSheet(); toast('Cobrança registrada'); } }, 400); }
async function copiar(t){
  try { await navigator.clipboard.writeText(t); toast('Pix copia e cola copiado'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Pix copia e cola copiado'); } catch(_) { toast('Selecione e copie o código manualmente'); } ta.remove(); }
}
function demo(){
  if (state.clientes.length && !confirm('Isso substitui os dados atuais pelos de exemplo. Continuar?')) return;
  const h = todayStr(); const ref = monthRef(h); const mes = MESES[parseD(h).getMonth()];
  const cl = [['Marcos Oliveira','61900000001',18000,5],['Juliana Ribeiro','61900000002',25000,10],['Pedro Almeida','61900000003',15000,20],['Carla Mendes','61900000004',0,0],['Rafael Costa','61900000005',0,0]]
    .map(([nome,fone,mensalidade,dia]) => ({id:uid(), nome, fone, mensalidade, dia}));
  const cb = (i, desc, v, d, extra={}) => ({id:uid(), clienteId:cl[i].id, descricao:desc, valor:v, venc:addDays(h,d), status:'aberta', contatos:[], ...extra});
  state = {settings:{nome:'Ana Souza', cidade:'Brasilia', pixTipo:'email', pixChave:'ana.aulas@exemplo.com', linkBase:'', centavosId:true, tplVersao:TPL_VERSAO, templates:{...DEFAULT_T}}, clientes:cl, cobrancas:[
    cb(0, `Mensalidade de ${mes}`, 18003, -9, {ref, idc:3, contatos:[{data:addDays(h,-9), etapa:'hoje'}]}),
    cb(3, 'Aulas avulsas de setembro', 24001, -4, {idc:1, contatos:[{data:addDays(h,-4), etapa:'hoje'}]}),
    cb(1, `Mensalidade de ${mes}`, 25002, 0, {ref, idc:2}),
    cb(4, 'Conserto do notebook', 32001, 2, {idc:1}),
    cb(2, `Mensalidade de ${mes}`, 15004, 6, {ref, idc:4}),
    cb(4, 'Formatação do computador', 12000, -12, {status:'paga', pagaEm:addDays(h,-1)}),
    cb(3, 'Aula extra de revisão', 8000, -6, {status:'paga', pagaEm:addDays(h,-5)})
  ]};
  /* histórico dos últimos 5 meses para as mensalidades */
  const base = parseD(h);
  const atrasos = [[0,2,0,1,0],[0,0,0,0,0],[6,9,null,5,8]];
  const valores = [18003, 25002, 15006], dias = [5, 10, 20];
  for (let k = 1; k <= 5; k++){
    const dt = new Date(base.getFullYear(), base.getMonth()-k, 1);
    const ultimo = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
    [0,1,2].forEach(i => {
      const venc = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(Math.min(dias[i], ultimo))}`;
      const atraso = atrasos[i][k-1];
      const pago = atraso !== null;
      state.cobrancas.push({id:uid(), clienteId:cl[i].id, descricao:`Mensalidade de ${MESES[dt.getMonth()]}`, valor:valores[i], venc, ref:venc.slice(0,7),
        status: pago ? 'paga' : 'aberta', pagaEm: pago ? addDays(venc, atraso) : undefined, contatos: pago ? [] : [{data:venc, etapa:'hoje'}]});
    });
    if (k === 2) state.cobrancas.push({id:uid(), clienteId:cl[3].id, descricao:'Pacote de aulas', valor:40000, venc:`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-15`, status:'paga', pagaEm:`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-15`, contatos:[]});
  }
  save(); tab = 'hoje'; closeSheet(); render(); toast('Dados de exemplo carregados. Os telefones são fictícios.');
}

let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  $('#view').innerHTML = ({hoje:vHoje, cobrancas:vCobrancas, clientes:vClientes, meses:vMeses, ajustes:vAjustes})[tab]();
  const d = parseD(todayStr()); $('#topdate').textContent = `${d.getDate()} de ${MESES[d.getMonth()]}`;
  const gw = document.querySelector('.grid-wrap'); const th = gw && gw.querySelector('th.atual');
  if (th) gw.scrollLeft = Math.max(0, th.offsetLeft - gw.clientWidth / 2);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const tb = e.target.closest('.tabs button'); if (tb){ tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  if (a === 'wa'){ registrarContato(id); return; }
  if (a === 'wa-pix'){ setTimeout(() => { closeSheet(); render(); toast('Código Pix enviado'); }, 400); return; }        /* deixa o link abrir o WhatsApp */
  e.preventDefault();
  switch(a){
    case 'close': closeSheet(); break;
    case 'ver-atrasadas': tab = 'cobrancas'; filtro = 'atrasadas'; render(); window.scrollTo(0,0); break;
    case 'copy-raw': copiar(el.dataset.code).then(() => { if (document.body.classList.contains('modo-pagar')) toast('Código copiado. Agora abra o app do seu banco.'); }); break;
    case 'pay-preview': { const c = state.cobrancas.find(x => x.id === id);
      openSheet(head('Página de pagamento') + paginaPagamento(dadosPagamento(c), true)); desenharQR($('#payqr'), pixPayload(c.valor, c.id)); break; }
    case 'goto': tab = el.dataset.tab; render(); break;
    case 'open-charge': sheetCharge(id); break;
    case 'open-client': sheetClient(id); break;
    case 'new-charge': sheetChargeForm(); break;
    case 'edit-charge': sheetChargeForm(id); break;
    case 'new-client': sheetClient(); break;
    case 'paid': marcarPago(id); break;
    case 'unpaid': { const c = state.cobrancas.find(x => x.id === id); c.status = 'aberta'; delete c.pagaEm; save(); closeSheet(); render(); toast('Cobrança reaberta'); break; }
    case 'copy': { const c = state.cobrancas.find(x => x.id === id); copiar(pixPayload(c.valor, c.id)); break; }
    case 'qr': { const c = state.cobrancas.find(x => x.id === id); const box = $('#qrbox'); const code = pixPayload(c.valor, c.id);
      if (box.innerHTML){ box.innerHTML = ''; break; }
      box.innerHTML = `<div class="qr" id="qrc"></div><p class="code">${esc(code)}</p>`;
      if (typeof QRCode === 'function') new QRCode($('#qrc'), {text:code, width:220, height:220, correctLevel:QRCode.CorrectLevel.M});
      else $('#qrc').outerHTML = '<p class="row-sub">Não foi possível desenhar o QR Code. Use o código acima.</p>';
      break; }
    case 'del-charge': if (confirm('Excluir esta cobrança?')){ state.cobrancas = state.cobrancas.filter(x => x.id !== id); save(); closeSheet(); render(); toast('Cobrança excluída'); } break;
    case 'del-client': if (confirm('Excluir o cliente e todas as cobranças dele?')){ state.clientes = state.clientes.filter(x => x.id !== id); state.cobrancas = state.cobrancas.filter(x => x.clienteId !== id); save(); closeSheet(); render(); toast('Cliente excluído'); } break;
    case 'filter': filtro = el.dataset.f; render(); break;
    case 'vista': vistaMeses = el.dataset.v; render(); break;
    case 'mes-prev': mudarMes(-1); render(); break;
    case 'mes-next': mudarMes(1); render(); break;
    case 'ano-prev': anoSel--; render(); break;
    case 'ano-next': anoSel++; render(); break;
    case 'abrir-mes': mesSel = el.dataset.ref; vistaMeses = 'mes'; render(); window.scrollTo(0,0); break;
    case 'gen': gerarMensalidades(); break;
    case 'demo': demo(); break;
    case 'reset-t': state.settings.templates = {...DEFAULT_T}; save(); render(); toast('Mensagens restauradas'); break;
    case 'wipe': if (confirm('Apagar todos os clientes, cobranças e ajustes deste aparelho?')){ state = fresh(); save(); render(); toast('Dados apagados'); } break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article.row')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'busca') $('#busca-res').innerHTML = resultadosBusca(e.target.value);
});
document.addEventListener('change', e => {
  if (e.target.matches('select[name="clienteId"]')) $('#novo-cli').hidden = e.target.value !== '__novo';
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  if (f.dataset.form === 'pix'){
    const lb = (v.linkBase||'').trim();
    if (lb && !/^https:\/\/[^\s]+\.[^\s]+/.test(lb)) return toast('O endereço da página precisa começar com https://');
    Object.assign(state.settings, {nome:v.nome.trim(), cidade:v.cidade.trim(), pixTipo:v.pixTipo, pixChave:v.pixChave.trim(), linkBase:lb, centavosId: !!v.centavosId, envio: v.envio === 'duas' ? 'duas' : 'link'});
    if (v.envio !== 'duas' && !linkBaseAuto()) toast('Sem endereço da página, o envio continua em duas mensagens');
    save(); render(); toast('Dados de recebimento salvos');
  }
  if (f.dataset.form === 'templates'){
    for (const k of Object.keys(DEFAULT_T)) state.settings.templates[k] = v[k];
    save(); toast('Mensagens salvas');
  }
  if (f.dataset.form === 'client'){
    const mens = v.mensalidade ? parseMoney(v.mensalidade) : 0;
    if (v.mensalidade && !mens) return toast('Informe a mensalidade como 150,00');
    const dia = mens ? Math.min(31, Math.max(1, parseInt(v.dia,10) || 0)) : 0;
    if (mens && !parseInt(v.dia,10)) return toast('Informe o dia do vencimento da mensalidade');
    const dados = {nome:v.nome.trim(), fone:v.fone.trim(), mensalidade:mens||0, dia};
    if (f.dataset.id) Object.assign(cliente(f.dataset.id), dados); else state.clientes.push({id:uid(), ...dados});
    save(); closeSheet(); render(); toast(f.dataset.id ? 'Cliente salvo' : 'Cliente cadastrado');
  }
  if (f.dataset.form === 'charge'){
    const valor = parseMoney(v.valor); if (!valor) return toast('Informe o valor como 150,00');
    let clienteId = v.clienteId;
    if (clienteId === '__novo'){
      if (!v.novoNome.trim() || !v.novoFone.trim()) return toast('Preencha nome e WhatsApp do novo cliente');
      clienteId = uid(); state.clientes.push({id:clienteId, nome:v.novoNome.trim(), fone:v.novoFone.trim(), mensalidade:0, dia:0});
    }
    const antiga = f.dataset.id ? state.cobrancas.find(x => x.id === f.dataset.id) : null;
    const u = (antiga && valor === antiga.valor - (antiga.idc||0)) ? {valor: antiga.valor, idc: antiga.idc||0} : centavosUnicos(valor, antiga && antiga.id);
    const dados = {clienteId, descricao:v.descricao.trim(), valor:u.valor, idc:u.idc, venc:v.venc};
    if (antiga) Object.assign(antiga, dados);
    else state.cobrancas.push({id:uid(), status:'aberta', contatos:[], ...dados});
    if (u.idc) toast(`Valor ajustado para ${money(u.valor)} para identificar o pagamento`);
    save(); closeSheet(); render(); if (!u.idc) toast(f.dataset.id ? 'Cobrança salva' : 'Cobrança criada');
  }
});

function iniciar(){
  const m = location.hash.match(/^#pagar=(.+)$/);
  if (m){
    try {
      const d = JSON.parse(unb64url(m[1]));
      if (!d.p || crc16(d.p.slice(0,-4)) !== d.p.slice(-4)) throw new Error('código inválido');
      document.body.classList.add('modo-pagar');
      $('#view').innerHTML = paginaPagamento(d, false); desenharQR($('#payqr'), d.p);
      document.title = `Pagar ${money(d.v)} para ${d.n}`;
    } catch(e){ document.body.classList.add('modo-pagar'); $('#view').innerHTML = '<div class="pay"><p class="pay-desc">Este link de pagamento está incompleto. Peça um novo link a quem fez a cobrança.</p></div>'; }
    return;
  }
  render();
}
iniciar();
</script>
</body>
</html>
